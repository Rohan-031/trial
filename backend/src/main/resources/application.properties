spring.application.name=croptalk-backend

# Node: process.env.PORT || 5000
server.port=${PORT:5000}

# Node: dotenv.config() read backend/.env. Spring Boot can import a KEY=VALUE .env file directly.
spring.config.import=optional:file:.env[.properties]

# Node: mongoose.connect(process.env.CONN_STRING)
spring.data.mongodb.uri=${CONN_STRING}
# Mongoose autoIndex created the unique indexes declared in the schemas
spring.data.mongodb.auto-index-creation=true

# Mongoose/Express serialise dates as ISO-8601 UTC with milliseconds
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# @clerk/clerk-sdk-node read CLERK_SECRET_KEY from the environment
clerk.secret-key=${CLERK_SECRET_KEY:}

# socket.io shared the Express HTTP port in Node; netty-socketio needs its own port
socketio.port=${SOCKET_PORT:9092}
# Node: new Server(httpServer, { cors: { origin: "http://localhost:5173" } })
socketio.origin=${SOCKET_CORS_ORIGIN:http://localhost:5173}

# Source defines /api/chat routes (chat.js) but never mounts them in server.js, so they are off by default.
croptalk.chat-rest.enabled=false
